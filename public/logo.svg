<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128C7E" />
      <stop offset="100%" stop-color="#075E54" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25" flood-color="#075E54"/>
    </filter>
  </defs>

  <!-- Main Circular Shield -->
  <circle cx="50" cy="50" r="46" fill="url(#bubbleGrad)" filter="url(#shadow)" />

  <!-- Primary Speech Bubble -->
  <path d="M 32 30 C 22 30 18 38 18 50 C 18 64 28 70 40 70 C 44 70 47 69 50 67 L 58 74 L 56 64 C 64 59 66 50 66 45 C 66 35 58 30 45 30 Z" 
        fill="#FFFFFF" opacity="0.96" />

  <!-- Secondary Overlapping 'Koodi' Speech Bubble (Representing Conversation Together) -->
  <path d="M 52 38 C 62 38 72 43 72 54 C 72 61 68 67 60 70 L 62 78 L 54 73 C 50 74 47 74 45 74 C 54 68 58 60 58 52 C 58 45 55 40 52 38 Z" 
        fill="url(#accentGrad)" />

  <!-- Chat Pulse Lines / Waves Inside Bubble -->
  <path d="M 29 46 Q 35 42 42 46 T 55 46" fill="none" stroke="#075E54" stroke-width="3" stroke-linecap="round" />
  <path d="M 32 54 Q 38 50 45 54 T 52 54" fill="none" stroke="#128C7E" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="30" cy="38" r="2.5" fill="#25D366" />
</svg>

